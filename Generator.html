<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Question Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #116434;
      color: white;
      text-align: center;
      padding: 30px;
    }
    .container {
      background: #13753f;
      border-radius: 15px;
      padding: 20px;
      max-width: 550px;
      margin: auto;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    button {
      background: #007bff;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      font-size: 16px;
    }
    button:hover { background: #00b35a; }
    .reset-btn { background: #dc3545; }
    .question-box {
      background: #0f2e52;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }
    a.view-btn {
      display: inline-block;
      margin-top: 8px;
      background: #28a745;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
    }
    a.view-btn:hover { background: #1e7e34; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hifz Tester Full Quran</h2>
    <p>﷽</p>
    <p><b>Riwayah:</b> Hafs</p>
    <p><b>Range:</b> Entire Qur'an</p>

    <button onclick="generateQuestions()">Generate Questions</button>
    <button class="reset-btn" onclick="resetQuestions()">Reset</button>

    <div id="questions"></div>
  </div>

  <script>
    const TOTAL_PAGES = 604;

    function randomPage(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions() {
      document.getElementById("questions").innerHTML = "";
      const usedPages = new Set();
      const outputDiv = document.getElementById("questions");

      for (let i = 1; i <= 3; i++) {
        let page;
        do {
          page = randomPage(1, TOTAL_PAGES);
        } while (usedPages.has(page));
        usedPages.add(page);

        const div = document.createElement("div");
        div.className = "question-box";
        const mushafLink = `https://quran.com/page/${page}`;
        div.innerHTML = `
          <h3>Question ${i}</h3>
          <p>Recite from </p>
          <a href="${mushafLink}" target="_blank" class="view-btn">View Mushaf Page</a>
        `;
        outputDiv.appendChild(div);
      }
    }

    function resetQuestions() {
      document.getElementById("questions").innerHTML = "";
    }
  </script>
</body>
</html>
